name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # weekly full run catches drift in runners and Python versions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for tests that create commits
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: Validate published skill frontmatter
        run: |
          python -m pip install "PyYAML==6.0.3"
          python tools/check_frontmatter.py
      - name: Fast check (tests, lint, package, fuzz)
        run: python tools/check.py

  full:
    name: full check (stress + deep fuzz, ${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: Full check
        run: python tools/check.py --full
